            - emphasis [ref=f4e25]: 2.71 Optics
            - text: ". Spring 2009. Massachusetts Institute of Technology: MIT OpenCourseWare,"
            - link "https://ocw.mit.edu/courses/2-71-optics-spring-2009/" [ref=f4e26] [cursor=pointer]:
