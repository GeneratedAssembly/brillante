            - text: ". License: Creative Commons BY 4.0."
        - paragraph [ref=f4e33]:
          - text: "MIT OCW 2.71/2.710 supplies the structure, the derivations, and the working engineer's perspective: 26 sessions moving from ray tracing through aberrations, wave optics, interferometry, and diffraction, up to imaging systems and resolution. OpenStax"
          - emphasis [ref=f4e34]: University Physics III
          - text: (chapters 1–4 only) supplies the introductory-physics treatment of the same phenomena — the nature of light, geometric optics, interference, and diffraction — which we use where a gentler first pass helps.
