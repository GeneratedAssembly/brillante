      - paragraph [ref=f4e18]: Where this course comes from, what licenses apply, and how every lesson credits its sources.
      - generic [ref=f4e19]:
        - paragraph [ref=f4e20]: Every lesson in this course was built from two openly licensed sources. This page states exactly what they are, what you may do with the result, and the rules every lesson follows when quoting or borrowing from them.
