services:
  pb-init:
    image: pocketbase/pocketbase:0.40.4
    # One-shot: creates the superuser on a fresh volume before serve starts.
    # PocketBase 0.23+ dropped the old env-var auto-create, and the official
    # image is scratch-based (no shell), so we invoke the binary's own
    # subcommand; compose expands these vars from .env.
    command:
      - superuser
      - upsert
      - ${PB_SUPERUSER_EMAIL:?set PB_SUPERUSER_EMAIL in .env}
      - ${PB_SUPERUSER_PASSWORD:?set PB_SUPERUSER_PASSWORD in .env}
      - --dir=/pb/pb_data
    volumes:
      - pb_data:/pb/pb_data
    restart: "no"

  pocketbase:
    image: pocketbase/pocketbase:0.40.4
    command: serve --http=0.0.0.0:8090 --dir=/pb/pb_data
    volumes:
      - pb_data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations:ro
      - ./pocketbase/pb_hooks:/pb/pb_hooks:ro
    environment:
      # Optional Auth0-backed SSO (Google + GitHub); the pb_hooks sync
      # script no-ops when these are unset.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
    # No host port mapping: PB stays internal; reach it through the tunnel
    # (a cloudflared ingress rule -> http://pocketbase:8090) if needed.
    depends_on:
      pb-init:
        condition: service_completed_successfully
    restart: unless-stopped

  brillante:
    build: .
    volumes:
      - ./deploy/brillante.compose.toml:/srv/brillante/brillante.toml:ro
      - ./content:/srv/brillante/content:ro
      - ./courses:/srv/brillante/courses:ro
      # ./courses/stats and ./courses/optics-course are symlinks to absolute
      # host paths, which have no meaning inside the container; mount the real
      # course dirs at flat paths instead (the empty courses/stats-course and
      # courses/optics dirs exist so the mount targets resolve).
      - /mnt/storage/code/brillante-courses/stats/course:/srv/brillante/courses/stats-course:ro
      - /mnt/storage/code/brillante-courses/optics-course:/srv/brillante/courses/optics:ro
    environment:
      # Used only by the startup bootstrap that keeps bootstrap_admins
      # promoted (and hidden tutor api_key reads/writes). Same superuser.
      BRILLANTE_PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?set PB_SUPERUSER_EMAIL in .env}
      BRILLANTE_PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?set PB_SUPERUSER_PASSWORD in .env}
    # No host port mapping: all ingress goes through the cloudflared tunnel.
    # No depends_on: podman-compose flattens the dependency graph into podman
    # --requires links, and the exited pb-init one-shot then blocks every
    # start/restart of this service ("container state improper"). Brillante
    # tolerates PocketBase being briefly unavailable at boot (bootstrap
    # retries; pages degrade gracefully), so start ordering is not load-bearing.
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Token-based (remotely-managed) tunnel: ingress rules live in the
    # Cloudflare dashboard (Zero Trust -> Networks -> Tunnels), pointing at
    # http://brillante:3000 (and optionally http://pocketbase:8090).
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    # No depends_on: cloudflared dials outbound and retries on its own, and
    # podman refuses to start past the exited pb-init one-shot otherwise.
    restart: unless-stopped

volumes:
  pb_data:
