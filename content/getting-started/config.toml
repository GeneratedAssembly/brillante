# Widget instance configs for this course.
# Each `[widgets."<id>"]` table holds the config for one widget instance,
# matched against the `id` attribute of a <Widget /> tag in a lesson.

[widgets."com.github.richbai90.quiz_basics"]
question = "What does the `type` attribute of a <Widget /> tag select?"
options = [
    "The widget kind the renderer should load",
    "The URL of the widget server",
    "The course difficulty",
    "The author's email address",
]
answer = 0
explanation = "`type` names the widget kind (the renderer component), while `id` looks up that instance's config in config.toml."

[widgets."com.github.richbai90.quiz_check"]
question = "Where does the server look up a widget's configuration?"
options = [
    "In the markdown frontmatter",
    "In config.toml, next to the course files",
    "In a database",
    "Widgets cannot be configured",
]
answer = 1
explanation = "The `id` attribute is matched against a `[widgets.\"<id>\"]` table in the course directory's config.toml."

[widgets."com.github.richbai90.slider_temperature"]
label = "Oven temperature"
min = 120
max = 260
step = 5
initial = 180
unit = "°C"

[widgets."com.github.richbai90.slider_reaction"]
label = "Reaction rate"
min = 0
max = 10
step = 0.5
initial = 2.5
display = "{value} mol/s — {value}"

[widgets."com.github.richbai90.plot_growth"]
title = "Exponential growth"
xlabel = "generation"
ylabel = "population"
series = [
    { name = "doubles every generation", color = "#6366f1", points = [[0, 1], [1, 2], [2, 4], [3, 8], [4, 16], [5, 32]] },
    { name = "linear (+3)", color = "#10b981", points = [[0, 1], [1, 4], [2, 7], [3, 10], [4, 13], [5, 16]] },
]

[widgets."com.github.richbai90.card_what_is_brillante"]
front = "What is Brillante?"
back = "A course platform that renders registered directories of markdown, where interactivity comes from <Widget /> tags resolved through a server-side widget registry."
